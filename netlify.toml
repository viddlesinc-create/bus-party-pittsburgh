# ---------------------------------------------------------------------------
# Deliberately NOT redirected (4 of the 38):
#
#   /?page_id=3448                      A query string on "/". A rule with
#                                       from = "/" would capture the homepage,
#                                       so this is left alone; it resolves to the
#                                       homepage today and is already indexed there.
#   /assets/hero-party-bus-BO2I66O1.jpg Stale content-hashed build asset.
#   /images/hero-party-bus.webp         Old image paths from the previous host;
#   /images/blog-bachelor-bachelorette-party.webp
#                                       image URLs, not landing pages.
#
# Trailing-slash normalization (/faqs/ vs /faqs) is NOT handled here on purpose.
# Google has picked the trailing-slash form as canonical for /faqs/ (306 impressions,
# position 3.1), /contact/ and /blog/party-bus-pricing-guide/, overriding our
# declared canonical. The obvious fix — a "/faqs/" -> "/faqs" rule — is unsafe:
# Netlify normalizes trailing slashes during matching, so such a rule can match its
# own target and loop, and that cannot be verified from CI. Enable the "Pretty URLs"
# post-processing setting in the Netlify UI instead, then confirm with:
#   curl -sI https://pittpartybus.com/faqs/   # expect 301 -> /faqs
#   curl -sI https://pittpartybus.com/faqs    # expect 200, not a redirect
# ---------------------------------------------------------------------------
