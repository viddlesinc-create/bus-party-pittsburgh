# Netlify build configuration for pittpartybus.com
#
# The prerender step is NOT optional: `vite build` alone emits only the SPA
# shell (dist/index.html + assets). Without `npm run prerender` every non-root
# route 404s in production, because this site has no redirects — routes are
# served from real prerendered HTML files (fleet.html, blog/*.html, ...).
#
# Three gates run after the prerender and all of them fail the build, which
# blocks the publish:
#
#   validate-routes.sh   every sitemap URL has a prerendered file with real
#                        content, and every referenced image resolves
#   validate-seo.mjs     title 50-60, description 140-160, both unique, one
#                        robots tag, self-canonical, one H1, valid JSON-LD, no
#                        unverifiable review markup, no schema image that 404s,
#                        FAQ answers 100-200 words AND visible on the page,
#                        BlogPosting complete, "Last updated" present, real tables
#   validate-sitemap.mjs absolute https on the exact property host, no duplicate
#                        or redirected URLs, ISO lastmod that is not in the future
#
# sync-sitemap-lastmod.mjs runs first and rewrites each <lastmod> in dist to the
# page's own dateModified, so the sitemap cannot contradict the page.
#
# A routeless or regressed deploy cannot go live.
#
# Deliberately NO /* -> /index.html catch-all redirect anywhere: unknown paths
# must return a real 404 (dist/404.html), never a 200 SPA shell.

[build]
  command = "npm run build && npm run prerender && node scripts/sync-sitemap-lastmod.mjs && bash scripts/validate-routes.sh --dist && node scripts/validate-seo.mjs && node scripts/validate-sitemap.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Hashed assets are immutable; cache them for a year (parity with the caching
# the old Apache .htaccess provided).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Legacy URL recovery (301)
#
# Google Search Console shows 38 URLs from the site's previous WordPress build
# still indexed and accumulating impressions — 12,875 impressions and 61 clicks
# over the last 16 months. None of them exist in this repo, and because there is
# deliberately no catch-all redirect (see the header comment), every one of them
# returns a hard 404 to real searchers.
#
# Eight of them still rank on page one:
#   /services/sporting-events/   pos 4.5    /?page_id=3448              pos 2.9
#   /locations/wexford/          pos 5.5    /about/                     pos 6.5
#   /faq-2/                      pos 7.3    /services/bachlorette-party/ pos 7.7
#   /services/concerts/          pos 8.1    /services/corporate-events/  pos 8.5
#
# These rules are explicit, one path each. They are NOT a catch-all and must not
# be replaced by one: an unknown path must still return dist/404.html.
#
# Netlify normalizes trailing slashes when matching, so `from = "/foo"` catches
# both /foo and /foo/. The `from` paths below are therefore written bare.
# ---------------------------------------------------------------------------

